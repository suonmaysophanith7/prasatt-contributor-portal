<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prasatt Element | Contributor Portal</title>
<style>
:root{--green:#176b4b;--green2:#0d4c38;--gold:#c99a43;--ink:#1f2937;--muted:#64748b;--line:#e5eaf0;--bg:#f5f7f9;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:#082e27;color:#e8f3ef;padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:2px 9px 28px}.brand-mark{width:43px;height:43px;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;border-radius:10px;font-size:25px}.brand-name{font-size:15px;line-height:1.05;font-weight:800;letter-spacing:1.7px}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#91b0a7;padding:12px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d1e2dc;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover,.nav button.active{background:#145440;color:white}.sidebar-bottom{margin-top:auto;border:1px solid #315b50;border-radius:12px;padding:13px;font-size:12px;color:#c3d8d1}.sidebar-bottom strong{display:block;color:white;margin-bottom:4px}.main{min-width:0;flex:1}.topbar{min-height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:15px}.top-title{font-size:19px;font-weight:750}.top-sub{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:12px}.user-chip{display:flex;align-items:center;gap:9px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8eee9;color:var(--green2);display:grid;place-items:center;font-weight:700}.content{padding:24px 28px;max-width:1500px;margin:auto}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:11px 16px;font-weight:650;font-size:13px}.btn:hover{background:var(--green2)}.btn:disabled{opacity:.6;cursor:wait}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.panel,.stat{background:white;border:1px solid var(--line);border-radius:13px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat{padding:17px}.stat strong{display:block;font-size:25px;margin:12px 0 3px}.stat span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th{text-align:left;color:#718096;font-size:11px;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf0f3;font-size:12px;vertical-align:middle}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}.pending{background:#fff1d9;color:#a45d05}.approved{background:#dcf5e8;color:#176b4b}.rejected{background:#fee8e7;color:#b42318}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.dropzone{display:block;border:1.5px dashed #80ad98;background:#f8fcfa;border-radius:12px;padding:28px;text-align:center;cursor:pointer}.dropzone:hover{background:#f0f8f3}.dropzone .upload-icon{font-size:34px;color:var(--green)}.dropzone p{font-size:13px;font-weight:650;margin:9px 0 4px}.dropzone small{color:var(--muted);font-size:11px}.form-row{display:grid;gap:6px;margin:14px 0}.form-row label{font-size:12px;font-weight:650}.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white;outline:none;font-size:13px}.form-row textarea{min-height:90px;resize:vertical}.file-list{display:grid;gap:9px;margin-top:12px}.file-item{display:flex;align-items:center;gap:10px;background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px}.file-thumb{width:58px;height:58px;flex:0 0 58px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px}.file-meta{min-width:0;flex:1;overflow-wrap:anywhere}.file-type{font-size:10px;color:var(--muted);margin-top:3px}.preview-thumb{width:62px;height:62px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px;vertical-align:middle}.admin-resource{display:flex;align-items:center;gap:9px;min-width:190px}.toast{position:fixed;bottom:22px;right:22px;background:#123f31;color:white;padding:12px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;font-size:13px;z-index:10;max-width:min(560px,90vw)}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#082e27}.login-art{padding:48px;color:white;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#0b3c31,#092b25)}.login-art h1{font-size:34px;max-width:420px;line-height:1.15}.login-art p{color:#c1d6cf;max-width:420px;font-size:14px;line-height:1.7}.login-box{background:white;display:grid;place-items:center;padding:25px}.login-card{width:min(390px,100%)}.login-card h2{font-size:25px;margin:0 0 8px}.login-card>p{font-size:13px;color:var(--muted);margin-bottom:24px}.login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px}.login-card label{font-size:12px;font-weight:650}.login-card .btn{width:100%;margin-top:8px}.link{color:var(--green);font-weight:650;cursor:pointer}.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:16px}
@media(max-width:950px){.sidebar{width:205px}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{display:none}.topbar{padding:12px 15px}.content{padding:16px}.top-actions{gap:8px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.login-wrap{grid-template-columns:1fr}.login-art{display:none}.login-box{min-height:100vh}.panel{padding:12px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
// Browser-safe Supabase project URL and publishable key.
const SUPABASE_URL = "https://mzbziblrehoxwyhvlplh.supabase.co";
const SUPABASE_KEY = "sb_publishable_R2LrW7ifeNeHn3iwsqFnkw_-LNgUZ9-";
const STORAGE_BUCKET = "design-files";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
let currentUser = null, currentProfile = null, submissions = [], page = "dashboard", files = [], authMode = "signin", isLoading = false;

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const contributorName = () => currentProfile?.full_name || currentUser?.user_metadata?.full_name || currentUser?.email?.split("@")[0] || "Contributor";
const isAdmin = () => String(currentProfile?.role || "").toLowerCase() === "admin";
const toast = msg => { const t=document.getElementById("toast"); t.textContent=msg; t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),5000); };
const pageTitle = () => ({dashboard:"Dashboard",submissions:"My Submissions",upload:"Upload New Submission",profile:"My Profile",settings:"Settings",admin:"Admin Review"}[page] || "Contributor Portal");
const fileExt = name => String(name||"").split(".").pop().toLowerCase();
const imagePreviewable = name => ["png","jpg","jpeg","webp","gif","svg","avif","bmp"].includes(fileExt(name));
const fileGlyph = name => ({ai:"AI",eps:"EPS",psd:"PSD",pdf:"PDF",zip:"ZIP",ttf:"TTF",otf:"OTF",svg:"SVG"})[fileExt(name)] || fileExt(name).toUpperCase() || "FILE";
const statusBadge = s => `<span class="badge ${["pending","approved","rejected"].includes(String(s).toLowerCase())?String(s).toLowerCase():"pending"}">${esc(s||"pending")}</span>`;

function renderAuth(){
  app.innerHTML=`<div class="login-wrap"><section class="login-art"><div><div class="brand"><div class="brand-mark">♜</div><div class="brand-name">PRASATT<br>ELEMENT</div></div><h1>Share your Khmer design resources with the community.</h1><p>Contributor Portal · Submit original Khmer graphics, vectors, fonts, illustrations and other creative resources for review.</p></div></section><section class="login-box"><form class="login-card" id="auth-form"><h2>${authMode==="signin"?"Welcome back":"Create contributor account"}</h2><p>${authMode==="signin"?"Sign in to manage your design submissions.":"Register to submit your Khmer design resources."}</p>${authMode==="signup"?`<label for="auth-name">Full name</label><input id="auth-name" autocomplete="name" required placeholder="Your name">`:""}<label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" required placeholder="name@example.com"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="${authMode==="signin"?"current-password":"new-password"}" minlength="6" required placeholder="At least 6 characters"><button class="btn" id="auth-submit" type="submit">${authMode==="signin"?"Sign in":"Create account"}</button><p style="margin-top:18px;text-align:center">${authMode==="signin"?`Don't have an account? <span class="link" id="auth-toggle">Create one</span>`:`Already registered? <span class="link" id="auth-toggle">Sign in</span>`}</p><div class="notice">Use your own account. Admin permissions must be granted securely in Supabase; this page does not provide an admin switch.</div></form></section></div>`;
  document.getElementById("auth-toggle").onclick=()=>{authMode=authMode==="signin"?"signup":"signin";renderAuth();};
  document.getElementById("auth-form").onsubmit=handleAuth;
}
async function handleAuth(e){
  e.preventDefault();const btn=document.getElementById("auth-submit");btn.disabled=true;
  const email=document.getElementById("auth-email").value.trim(),password=document.getElementById("auth-password").value;
  try{
    if(authMode==="signup"){
      const full_name=document.getElementById("auth-name").value.trim();
      const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name}}});if(error)throw error;
      if(data.session){await loadPortal();}else toast("Account created. Check your email to confirm, then sign in.");
    }else{const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await loadPortal();}
  }catch(err){console.error(err);toast(err.message||"Authentication failed.");}finally{btn.disabled=false;}
}
function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brand-mark">♜</div><div class="brand-name">PRASATT<br>ELEMENT</div></div><div class="nav-label">${isAdmin()?"Admin Portal":"Contributor Portal"}</div><nav class="nav">${nav("dashboard","⌂","Dashboard")}${nav("submissions","▤","My Submissions")}${isAdmin()?nav("admin","✓","Admin Review"):""}${nav("upload","⊕","Upload New")}${nav("profile","♙","My Profile")}${nav("settings","⚙","Settings")}</nav><div class="sidebar-bottom"><strong>↗ View Website</strong>prasattelement.net</div></aside>`;}
function nav(id,icon,label){return `<button class="${page===id?"active":""}" onclick="go('${id}')">${icon} &nbsp; ${label}</button>`;}
function header(){return `<header class="topbar"><div><div class="top-title">${pageTitle()}</div><div class="top-sub">Welcome back, ${esc(contributorName())}!</div></div><div class="top-actions"><div class="user-chip"><div class="avatar">${esc(contributorName().slice(0,2).toUpperCase())}</div><div><strong>${esc(contributorName())}</strong><div class="muted">${isAdmin()?"Admin":"Contributor"}</div></div></div><button class="btn secondary" onclick="signOut()">Sign out</button></div></header>`;}
function go(p){if(p==="admin"&&!isAdmin()){toast("Admin access required.");return;}page=p;render();}
function stats(){const n=submissions.length,p=submissions.filter(x=>x.status==="pending").length,a=submissions.filter(x=>x.status==="approved").length,r=submissions.filter(x=>x.status==="rejected").length;return `<div class="stats">${stat(n,"Total submissions")}${stat(p,"Pending review")}${stat(a,"Approved")}${stat(r,"Needs changes / rejected")}</div>`;}
function stat(n,label){return `<div class="stat"><strong>${n}</strong><span>${label}</span></div>`;}
function rowsTable(items){if(!items.length)return `<div class="empty">No submissions yet. Use “Upload New” to submit your first resource.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Resource</th><th>Category</th><th>Submitted</th><th>Status</th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.title)}</strong><div class="muted">${esc(x.asset_type||x.formats?.join(", ")||"")}</div></td><td>${esc(x.category||"—")}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString():"—"}</td><td>${statusBadge(x.status)}</td></tr>`).join("")}</tbody></table></div>`;}
function dashboard(){return `${stats()}<section class="panel"><div class="panel-head"><div><h2>Recent submissions</h2><div class="muted">Track the review status of your resources.</div></div><button class="btn" onclick="go('upload')">Upload New Design</button></div>${rowsTable(submissions.slice(0,5))}</section>`;}
function submissionsView(){return `${stats()}<section class="panel"><div class="panel-head"><h2>My submissions</h2></div>${rowsTable(submissions)}</section>`;}
function uploadView(){return `<section class="panel"><div class="panel-head"><div><h2>Share your Khmer design resource</h2><div class="muted">Upload artwork for review by the Prasatt Element team.</div></div></div><form id="submission-form"><div class="form-grid"><div><label class="dropzone" for="files"><div class="upload-icon">☁</div><p>Choose design files to upload</p><small>AI, EPS, SVG, PSD, PNG, JPG, ZIP, TTF, OTF · Up to 50 MB per file. Image files show an instant preview; AI/EPS/PSD automatic previews require a backend converter.</small><input id="files" type="file" multiple hidden accept=".ai,.eps,.svg,.psd,.png,.jpg,.jpeg,.zip,.ttf,.otf,.pdf,.webp"></label><div id="file-list" class="file-list"></div><div class="form-row"><label for="title">Resource title *</label><input id="title" required placeholder="Design title"></div><div class="form-row"><label for="description">Description *</label><textarea id="description" required placeholder="Describe your design..."></textarea></div></div><div><div class="form-row"><label for="category">Category *</label><select id="category" required><option value="">Select category</option>${["Vector","Khmer Kbach","Illustration","Pattern","Font","3D Model","Photography","Other"].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div><div class="form-row"><label for="asset-type">Asset type *</label><select id="asset-type" required><option value="">Select asset type</option>${["Vector","Font","Illustration","Pattern","3D Model","Photo","Document","Other"].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div><div class="form-row"><label for="tags">Tags</label><input id="tags" placeholder="khmer, kbach, vector"></div><div class="form-row"><label for="license">License / ownership *</label><select id="license" required><option value="">Choose one</option><option>I created this work and own the rights</option><option>I have permission to submit this work</option></select></div><div class="form-row"><label><input id="agree" type="checkbox" required style="width:auto"> I confirm I have the right to submit these files.</label></div><button class="btn" id="submit-btn" type="submit">Upload and Submit for Review →</button></div></div></form></section>`;}
function adminView(){if(!isAdmin())return `<section class="panel"><h2>Access restricted</h2><p class="muted">This account does not have admin permissions.</p></section>`;return `<section class="panel"><div class="panel-head"><div><h2>Submission review</h2><div class="muted">Review contributor uploads and update their status.</div></div></div>${submissions.length?`<div class="table-wrap"><table><thead><tr><th>Resource</th><th>Contributor</th><th>Category</th><th>Submitted</th><th>Status</th><th>Review actions</th></tr></thead><tbody>${submissions.map(x=>`<tr><td><strong>${esc(x.title)}</strong><div class="muted">${esc(x.description||"")}</div></td><td>${esc(x.contributor_name||"—")}</td><td>${esc(x.category||"—")}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString():"—"}</td><td>${statusBadge(x.status)}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" style="padding:7px 9px;font-size:11px" onclick="reviewSubmission('${esc(x.id)}','approved')">Approve</button><button class="btn secondary" style="padding:7px 9px;font-size:11px" onclick="reviewSubmission('${esc(x.id)}','rejected')">Reject</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No submissions are available for review.</div>`}<p class="notice">Admin actions require matching Supabase Row Level Security policies. If an action is denied, configure secure admin-only SELECT and UPDATE policies; do not disable RLS.</p></section>`;}
async function reviewSubmission(id,status){if(!isAdmin()){toast("Admin access required.");return;}const note=status==="rejected"?prompt("Optional feedback for the contributor:"):"";if(status==="rejected"&&note===null)return;const {error}=await supabaseClient.from("submissions").update({status,admin_notes:note||null,updated_at:new Date().toISOString()}).eq("id",id);if(error){console.error(error);toast("Review update failed: "+error.message);return;}await loadPortal();toast("Submission marked "+status+".");}
function profileView(){return `<section class="panel"><h2>My Profile</h2><p><b>Name:</b> ${esc(contributorName())}</p><p><b>Email:</b> ${esc(currentUser?.email||"")}</p><p><b>Role:</b> ${esc(isAdmin()?"Admin":"Contributor")}</p></section>`;}
function settingsView(){return `<section class="panel"><h2>Settings</h2><p class="muted">Account settings are managed through your sign-in account.</p><button class="btn secondary" onclick="signOut()">Sign out</button></section>`;}
function render(){if(!currentUser){renderAuth();return;}let body=page==="dashboard"?dashboard():page==="submissions"?submissionsView():page==="upload"?uploadView():page==="profile"?profileView():page==="admin"?adminView():settingsView();app.innerHTML=`<div class="shell">${sidebar()}<main class="main">${header()}<div class="content">${body}</div></main></div>`;if(page==="upload"){document.getElementById("files").onchange=e=>{files=[...e.target.files];document.getElementById("file-list").innerHTML=files.map((f,i)=>`<div class="file-item">${imagePreviewable(f.name)?`<img class="file-thumb" src="${URL.createObjectURL(f)}" alt="Preview of ${esc(f.name)}">`:`<div class="file-thumb" style="display:grid;place-items:center;font-weight:800;color:var(--green)">${esc(fileGlyph(f.name))}</div>`}<div class="file-meta"><strong>${esc(f.name)}</strong><div class="file-type">${esc(fileGlyph(f.name))} · ${(f.size/1048576).toFixed(2)} MB${imagePreviewable(f.name)?" · Image preview available":" · Preview generation for this format requires a server-side converter"}</div></div></div>`).join("");};document.getElementById("submission-form").onsubmit=submitResource;}}
async function loadPortal(){
  const {data:{user},error}=await supabaseClient.auth.getUser();if(error)throw error;if(!user){currentUser=null;renderAuth();return;}
  currentUser=user;
  // Profile read is optional; the auth metadata/email still supplies a display name if no row exists.
  const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("id,full_name,email,role").eq("id",user.id).maybeSingle();
  if(profileError)console.warn("Profile lookup:",profileError.message);
  currentProfile=profile||{id:user.id,full_name:user.user_metadata?.full_name||user.email?.split("@")[0],email:user.email,role:"contributor"};
  let submissionQuery=supabaseClient.from("submissions").select("id,user_id,title,description,asset_type,file_path,status,admin_notes,created_at,updated_at,contributor_name,category,formats,file_paths,tags,license");if(!isAdmin())submissionQuery=submissionQuery.eq("user_id",user.id);const {data,error:subError}=await submissionQuery.order("created_at",{ascending:false});
  if(subError)throw subError;submissions=data||[];render();
}
async function submitResource(e){
  e.preventDefault();if(!currentUser){renderAuth();return;}if(!files.length){toast("Please select at least one file.");return;}if(files.some(f=>f.size>50*1048576)){toast("Each file must be 50 MB or less.");return;}
  const btn=document.getElementById("submit-btn");btn.disabled=true;btn.textContent="Uploading…";const uploaded=[];
  try{
    for(const file of files){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`${currentUser.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});if(error)throw error;uploaded.push({path,name:file.name,size:file.size,type:file.type,format:file.name.split(".").pop().toUpperCase()});}
    const formats=[...new Set(uploaded.map(f=>f.format))];
    const payload={user_id:currentUser.id,contributor_name:contributorName(),title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,asset_type:document.getElementById("asset-type").value,description:document.getElementById("description").value.trim(),formats,file_path:uploaded[0]?.path||null,file_paths:uploaded,tags:document.getElementById("tags").value.split(",").map(s=>s.trim()).filter(Boolean),license:document.getElementById("license").value,status:"pending"};
    const {error}=await supabaseClient.from("submissions").insert(payload);if(error)throw error;
    files=[];await loadPortal();toast("Submission uploaded for review.");
  }catch(err){console.error(err);toast("Upload failed: "+(err.message||"Check Supabase table columns and RLS policies."));btn.disabled=false;btn.textContent="Upload and Submit for Review →";}
}
async function signOut(){const {error}=await supabaseClient.auth.signOut();if(error)toast(error.message);}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){currentUser=null;currentProfile=null;submissions=[];files=[];page="dashboard";renderAuth();}});
(async()=>{try{const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(session)await loadPortal();else renderAuth();}catch(err){console.error(err);app.innerHTML=`<div style="max-width:720px;margin:10vh auto;background:white;padding:28px;border-radius:12px"><h2>Portal could not start</h2><p>${esc(err.message||"Unknown startup error")}</p><p>Check the Supabase project URL, publishable key, and browser Console.</p></div>`;}})();
</script>
</body>
</html>
