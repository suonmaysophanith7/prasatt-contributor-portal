<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prasatt Element | Contributor Portal</title>
<style>
:root{--green:#176b4b;--green2:#0d4c38;--gold:#c99a43;--ink:#1f2937;--muted:#64748b;--line:#e5eaf0;--bg:#f5f7f9;--white:#fff;--amber:#b76a0b;--red:#c2413b;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:#082e27;color:#e8f3ef;padding:22px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:2px 9px 28px}.brand-mark{width:43px;height:43px;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;border-radius:10px;font-size:25px}.brand-name{font-size:15px;line-height:1.05;font-weight:800;letter-spacing:1.7px}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#91b0a7;padding:12px 12px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d1e2dc;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover,.nav button.active{background:#145440;color:white}.nav .ico{width:18px;text-align:center;font-size:16px}.nav .count{margin-left:auto;background:#23765a;color:white;border-radius:20px;padding:2px 7px;font-size:10px}.sidebar-bottom{margin-top:auto;border:1px solid #315b50;border-radius:12px;padding:13px;font-size:12px;color:#c3d8d1}.sidebar-bottom strong{display:block;color:white;margin-bottom:4px}.main{min-width:0;flex:1}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.top-title{font-size:19px;font-weight:750}.top-sub{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;align-items:center;gap:17px}.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:min(330px,32vw);outline:none}.user-chip{display:flex;align-items:center;gap:9px;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8eee9;color:var(--green2);display:grid;place-items:center;font-weight:700}.content{padding:24px 28px;max-width:1500px;margin:auto}.welcome{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.welcome h1{font-size:23px;margin:0 0 5px}.welcome p{font-size:13px;color:var(--muted);margin:0}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:11px 16px;font-weight:650;font-size:13px}.btn:hover{background:var(--green2)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.warning{background:#d97706}.btn.danger{background:#dc4540}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:13px}.stat{padding:17px}.stat-icon{width:34px;height:34px;border-radius:10px;background:#edf5f1;color:var(--green);display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:25px;margin:12px 0 3px}.stat span{font-size:12px;color:var(--muted)}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 11px;color:var(--ink);outline:none;min-width:140px}.field:focus,textarea:focus{border-color:#5b9a7e;box-shadow:0 0 0 3px #176b4b16}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th{text-align:left;color:#718096;font-size:11px;font-weight:650;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #edf0f3;font-size:12px;vertical-align:middle}tr:last-child td{border-bottom:0}.resource{display:flex;align-items:center;gap:10px;min-width:180px}.thumb{width:43px;height:43px;border-radius:8px;background:#f7f2e7;display:grid;place-items:center;color:#a7792f;font-size:23px;flex-shrink:0}.resource strong{display:block;font-size:12px}.resource small{display:block;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}.pending{background:#fff1d9;color:#a45d05}.approved{background:#dcf5e8;color:#176b4b}.changes{background:#fff0df;color:#b45309}.rejected{background:#fee8e7;color:#b42318}.actions{display:flex;gap:5px}.iconbtn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 8px;color:#475569}.iconbtn:hover{border-color:#8eb5a2;color:var(--green)}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.view{display:none}.view.active{display:block}.form-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.dropzone{border:1.5px dashed #80ad98;background:#f8fcfa;border-radius:12px;padding:28px;text-align:center;cursor:pointer}.dropzone:hover{background:#f0f8f3}.dropzone .upload-icon{font-size:34px;color:var(--green)}.dropzone p{font-size:13px;font-weight:650;margin:9px 0 4px}.dropzone small{color:var(--muted);font-size:11px}.form-row{display:grid;gap:6px;margin:14px 0}.form-row label{font-size:12px;font-weight:650}.form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white;outline:none;font-size:13px}.form-row textarea{min-height:90px;resize:vertical}.file-list{display:grid;gap:7px;margin-top:12px}.file-item{display:flex;align-items:center;justify-content:space-between;background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tab{border:0;background:transparent;padding:10px 13px;color:var(--muted);font-size:12px;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--green);border-color:var(--green);font-weight:700}.profile{display:grid;grid-template-columns:220px 1fr;gap:18px}.profile-card{text-align:center;padding:24px}.big-avatar{width:75px;height:75px;border-radius:50%;background:#e6f0e9;color:var(--green);display:grid;place-items:center;font-size:27px;font-weight:800;margin:0 auto 12px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.detail{padding:13px;border:1px solid var(--line);border-radius:9px}.detail small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.detail strong{font-size:13px}.toast{position:fixed;bottom:22px;right:22px;background:#123f31;color:white;padding:12px 17px;border-radius:10px;box-shadow:0 10px 30px #0002;font-size:13px;z-index:10}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#082e27}.login-art{padding:48px;color:white;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#0b3c31,#092b25)}.login-art h1{font-size:34px;max-width:420px;line-height:1.15}.login-art p{color:#c1d6cf;max-width:420px;font-size:14px;line-height:1.7}.login-box{background:white;display:grid;place-items:center;padding:25px}.login-card{width:min(390px,100%)}.login-card h2{font-size:25px;margin:0 0 8px}.login-card>p{font-size:13px;color:var(--muted);margin-bottom:24px}.login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px}.login-card label{font-size:12px;font-weight:650}.login-card .btn{width:100%;margin-top:8px}.link{color:var(--green);font-weight:650;cursor:pointer}.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:16px}.mobile-menu{display:none}
@media(max-width:950px){.sidebar{width:205px}.content{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.search{width:220px}}
@media(max-width:650px){.sidebar{display:none}.topbar{padding:0 15px;height:64px}.content{padding:16px}.top-actions{gap:8px}.search{display:none}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.welcome{align-items:flex-start}.welcome h1{font-size:20px}.welcome .btn{padding:9px 11px;font-size:11px}.profile{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.login-wrap{grid-template-columns:1fr}.login-art{display:none}.login-box{min-height:100vh}.panel{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mzbziblrehoxwyhvlplh.supabase.co";
const SUPABASE_KEY = "sb_publishable_R2LrW7ifeNeHn3iwsqFnkw_-LNgUZ9-";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
const app=document.getElementById('app');
const sample=[
{id:1,title:'Khmer Kbach Floral Ornament',contributor:'Sok Dara',category:'Vector',formats:'AI, EPS, SVG',date:'Sep 28, 2026',status:'Pending',glyph:'❋',desc:'Traditional Khmer floral ornament vector design.'},
{id:2,title:'Angkor Wat Line Art',contributor:'Chantha Design',category:'Illustration',formats:'SVG, PNG',date:'Sep 26, 2026',status:'Approved',glyph:'♜',desc:'Minimal Angkor Wat line illustration.'},
{id:3,title:'Traditional Khmer Pattern',contributor:'Nita Art',category:'Pattern',formats:'AI, PNG, JPG',date:'Sep 24, 2026',status:'Pending',glyph:'❖',desc:'Repeating decorative Khmer pattern.'},
{id:4,title:'Khmer Mythical Creature',contributor:'Vuthy Chem',category:'Illustration',formats:'AI, EPS, PNG',date:'Sep 20, 2026',status:'Needs Changes',glyph:'♞',desc:'Traditional-inspired mythical creature illustration.'},
{id:5,title:'Khmer Font Style',contributor:'Sreyneng',category:'Font',formats:'TTF, OTF, ZIP',date:'Sep 18, 2026',status:'Pending',glyph:'ក',desc:'Khmer typeface submission.'},
{id:6,title:'3D Angkor Model',contributor:'Dara 3D',category:'3D Model',formats:'BLEND, FBX, ZIP',date:'Sep 16, 2026',status:'Pending',glyph:'▥',desc:'Three-dimensional temple model.'},
{id:7,title:'Khmer Frame Ornament',contributor:'Sothea Art',category:'Vector',formats:'AI, EPS, PNG',date:'Sep 14, 2026',status:'Approved',glyph:'❀',desc:'Decorative frame inspired by Khmer art.'},
{id:8,title:'Cambodian Agriculture Icon',contributor:'Piseth Kh',category:'Illustration',formats:'AI, SVG, PNG',date:'Sep 12, 2026',status:'Pending',glyph:'♧',desc:'Farm and vegetable illustration.'}
];
let submissions=JSON.parse(localStorage.getItem('pe_submissions')||'null')||sample;
let role='contributor', page='dashboard', filter='All', selectedId=1, files=[];
function save(){localStorage.setItem('pe_submissions',JSON.stringify(submissions))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function statusClass(s){const v=String(s||'pending').toLowerCase();return v==='approved'?'approved':v==='rejected'?'rejected':'pending'}
function icon(g){return `<span class="ico">${g}</span>`}
function brand(){return `<div class="brand"><div class="brand-mark">♜</div><div class="brand-name">PRASATT<br>ELEMENT</div></div>`}
function navItem(id,label,g,count=''){return `<button class="${page===id?'active':''}" onclick="go('${id}')">${icon(g)}${label}${count?`<span class="count">${count}</span>`:''}</button>`}
function sidebar(){return `<aside class="sidebar">${brand()}<div class="nav-label">${role==='admin'?'Admin Panel':'Contributor Portal'}</div><nav class="nav">${role==='admin'?navItem('dashboard','Dashboard','⌂')+navItem('submissions','Submissions','▤',submissions.filter(x=>String(x.status).toLowerCase()==='pending').length)+navItem('contributors','Contributors','♙')+navItem('categories','Categories','▦')+navItem('published','Published Items','◇')+navItem('messages','Messages','✉')+navItem('settings','Settings','⚙'):navItem('dashboard','Dashboard','⌂')+navItem('my-submissions','My Submissions','▤')+navItem('upload','Upload New','⊕')+navItem('messages','Messages','✉')+navItem('profile','My Profile','♙')+navItem('settings','Settings','⚙')}</nav><div class="sidebar-bottom"><strong>↗ View Website</strong>prasattelement.net<br><small style="color:#91b0a7">Demo portal interface</small></div></aside>`}
function header(){const name=contributorName();return `<header class="topbar"><div><div class="top-title">${pageTitle()}</div><div class="top-sub">${role==='admin'?'Manage and review contributor submissions':`Welcome back, ${escHtml(name)}!`}</div></div><div class="top-actions"><input class="search" placeholder="⌕  Search submissions, contributor..." oninput="searchRows(this.value)"><button class="iconbtn" title="Notifications" onclick="toast('No new notifications')">♧</button><div class="user-chip"><div class="avatar">${escHtml(name.slice(0,2).toUpperCase())}</div><div><strong>${escHtml(name)}</strong><div class="muted">${role==='admin'?'Administrator':'Contributor'}</div></div></div><button class="iconbtn" onclick="signOut()" title="Sign out">↪</button></div></header>`}
function dashboard(){const a=myRows();return `${stats()}<section class="panel"><div class="panel-head"><div><h2>Recent Submissions</h2><div class="muted">Your latest design submissions and review statuses.</div></div><button class="btn" onclick="go('${role==="admin"?"submissions":"upload"}')">${role==="admin"?"View Submissions":"Upload New Design"}</button></div>${table(a.slice(0,5))}</section>`;}
function submissionsView(){let a=myRows();if(filter!=="All")a=a.filter(x=>String(x.status||"").toLowerCase()===String(filter).toLowerCase());return `${stats()}<section class="panel"><div class="panel-head"><h2>${role==="admin"?"All Submissions":"My Submissions"}</h2></div><div class="tabs">${["All","pending","approved","rejected"].map(s=>`<button class="tab ${filter===s?"active":""}" onclick="filter='${s}';render()">${s==="All"?"All":s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join("")}</div>${table(a)}</section>`;}
function uploadView(){return `<section class="panel"><div class="panel-head"><div><h2>Share your Khmer design resource</h2><div class="muted">Upload artwork for review by the Prasatt Element team.</div></div></div><form onsubmit="submitResource(event)"><div class="form-grid"><div><label class="dropzone" for="files"><div class="upload-icon">☁</div><p>Choose design files to upload</p><small>AI, EPS, SVG, PSD, PNG, JPG, ZIP, TTF, OTF · Up to 50 MB per file</small><input id="files" type="file" multiple hidden onchange="showFiles(this.files)"></label><div id="file-list" class="file-list"></div><div class="form-row"><label>Resource title *</label><input id="title" required placeholder="Design title"></div><div class="form-row"><label>Description *</label><textarea id="desc" required placeholder="Describe your design..."></textarea></div></div><div><div class="form-row"><label>Category *</label><select id="category" required><option value="">Select category</option>${["Vector","Khmer Kbach","Illustration","Pattern","Font","3D Model","Photography","Other"].map(c=>`<option>${c}</option>`).join("")}</select></div><div class="form-row"><label>Tags</label><input id="tags" placeholder="khmer, kbach, vector"></div><div class="form-row"><label>License / ownership *</label><select id="license" required><option value="">Choose one</option><option>I created this work and own the rights</option><option>I have permission to submit this work</option></select></div><div class="form-row"><label><input id="agree" type="checkbox" required style="width:auto"> I confirm I have the right to submit these files.</label></div><button class="btn" id="submit-btn" type="submit">Upload and Submit for Review →</button></div></div></form></section>`;}
function profileView(){return `<section class="panel"><h2>My Profile</h2><p><b>Name:</b> ${escHtml(contributorName())}</p><p><b>Email:</b> ${escHtml(currentUser?.email||"")}</p></section>`;}
function render(){if(!currentUser){renderAuth();return;}const body=page==="dashboard"?dashboard():["submissions","my-submissions"].includes(page)?submissionsView():page==="upload"?uploadView():page==="profile"?profileView():genericView();app.innerHTML=`<div class="shell">${sidebar()}<main class="main">${header()}<div class="content"><div class="view active">${body}</div></div></main></div>`;}
function showFiles(f){files=[...f];const el=document.getElementById("file-list");if(el)el.innerHTML=files.map(f=>`<div class="file-item"><span>▤ ${escHtml(f.name)}</span><span>${(f.size/1048576).toFixed(2)} MB</span></div>`).join("");}
async function submitResource(e){
 e.preventDefault();if(!currentUser){renderAuth();return;}if(!files.length){toast("Please select at least one file.");return;}if(files.some(f=>f.size>50*1048576)){toast("Each file must be 50 MB or less.");return;}
 const btn=document.getElementById("submit-btn");btn.disabled=true;btn.textContent="Uploading…";const uploaded=[];
 try{
  for(const file of files){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path=`${currentUser.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});if(error)throw error;uploaded.push({path,name:file.name,size:file.size,type:file.type,format:file.name.split(".").pop().toUpperCase()});}
  const payload={user_id:currentUser.id,contributor_name:contributorName(),title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,asset_type:[...new Set(uploaded.map(f=>f.format))].join(", "),description:document.getElementById("desc").value.trim(),formats:[...new Set(uploaded.map(f=>f.format))],file_path:uploaded[0]?.path||null,file_paths:uploaded,tags:document.getElementById("tags").value.split(",").map(s=>s.trim()).filter(Boolean),license:document.getElementById("license").value,status:"pending"};
  const {error}=await supabaseClient.from("submissions").insert(payload);if(error)throw error;files=[];await loadSupabasePortal();toast("Submission uploaded for review.");
 }catch(err){console.error(err);toast("Upload failed: "+(err.message||"Check Supabase policies and table columns."));btn.disabled=false;btn.textContent="Upload and Submit for Review →";}
}
async function setStatus(id,status){if(role!=="admin"){toast("Admin access required.");return;}const {error}=await supabaseClient.from("submissions").update({status}).eq("id",id);if(error){toast(error.message);return;}await loadSupabasePortal();toast("Status updated.");}
async function selectSubmission(id){const x=submissions.find(s=>String(s.id)===String(id));if(x)alert(`${x.title}\nCategory: ${x.category}\nStatus: ${x.status}\nDescription: ${x.description||""}`);}
supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session?.user)setTimeout(loadSupabasePortal,0);if(event==="SIGNED_OUT"){currentUser=null;currentProfile=null;submissions=[];renderAuth();}});
(async()=>{const {data:{session}}=await supabaseClient.auth.getSession();if(session)await loadSupabasePortal();else renderAuth();})();
</script>

</body>
</html>
